<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TariffLens · 关税与贸易合规参考</title>
<link rel="icon" href="data:,">
<style>
:root{
  --paper:#f7f6f2; --paper-2:#fffdf7; --paper-3:#f1eee5;
  /* --ink-mute 实测 3.90:1 未达 WCAG AA（小字需 4.5:1），已压深到 #656b70 ≈ 4.99:1。
     不要改回 #767c82 —— 元数据行（refline / field .k）字号只有 9.5–10.5px，属小字。 */
  --ink:#101418; --ink-soft:#3d4348; --ink-mute:#656b70;
  --line:#d8d3c7; --line-hair:#e6e2d8; --rule:#101418;
  --vermilion:#a8321f; --indigo:#1a4fd6; --amber:#8a6a1f;
  --ok:#137a3b; --warn:#a8641f;
  --serif:"Songti SC","Noto Serif CJK SC","Source Han Serif SC",Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,"SF Mono",Consolas,monospace;
  --measure:620px;
  --grid:none;
}
html[lang="en"]{ --measure:680px }
html[data-theme="dark"]{
  --paper:#14130f; --paper-2:#1b1915; --paper-3:#221f1a;
  --ink:#ece6d8; --ink-soft:#c4bda9; --ink-mute:#8b8474;
  --line:#3a3529; --line-hair:#2c2820; --rule:#8a8270;
  --vermilion:#e0664a; --indigo:#7fa2ff; --amber:#d8b45c;
  --ok:#54b871; --warn:#d99a4e;
  --grid:repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--serif); font-size:16px; line-height:1.72;
  background-image:var(--grid);
  -webkit-font-smoothing:antialiased;
}
.wrap{ max-width:var(--measure); margin:0 auto; padding:0 22px 96px; }

/* ---------- 报头 masthead ---------- */
.masthead{ padding:34px 0 0; }
.masthead .rule-top{ border-top:3px double var(--rule); }
.masthead .rule-thin{ border-top:1px solid var(--rule); margin-top:2px }
.mh-title{
  font-family:var(--serif); font-size:31px; letter-spacing:.16em;
  text-align:center; margin:16px 0 4px; font-weight:600;
}
/* 适用范围副标题：紧贴主标题之下，口径写在报头，避免读者以为是通用关税工具 */
.mh-scope{
  font-family:var(--serif); font-size:18.5px; letter-spacing:.15em; font-weight:600;
  text-align:center; color:var(--ink); margin:7px 0 3px; line-height:1.55;
}
.mh-scope b{ color:var(--ink-soft); font-weight:600 }
.mh-sub{
  font-family:var(--sans); font-size:12px; letter-spacing:.1em;
  text-align:center; color:var(--ink-mute); margin:6px 0 12px;
}
.mh-meta{
  display:flex; flex-wrap:wrap; gap:0 14px; justify-content:center;
  font-family:var(--mono); font-size:10.5px; color:var(--ink-mute);
  padding:9px 0; border-top:1px solid var(--line-hair); border-bottom:1px solid var(--line-hair);
}
.mh-meta b{ color:var(--ink-soft); font-weight:500 }
.mh-tools{ display:flex; justify-content:flex-end; gap:8px; margin-top:10px }
.tbtn{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.06em;
  background:none; border:1px solid var(--line); color:var(--ink-soft);
  padding:4px 9px; cursor:pointer;
}
.tbtn:hover{ border-color:var(--rule); color:var(--ink) }
.tbtn[aria-pressed="true"]{ background:var(--ink); color:var(--paper); border-color:var(--ink) }

/* ---------- 查询 ---------- */
.search{ margin:26px 0 0; padding:18px 0; border-bottom:3px double var(--rule) }
.srow{ display:flex; gap:9px; align-items:stretch }
.srow input{
  flex:1; font-family:var(--mono); font-size:15px; letter-spacing:.05em;
  padding:9px 11px; border:1px solid var(--line); background:var(--paper-2); color:var(--ink);
}
.srow input:focus{ outline:none; border-color:var(--rule) }
.srow button{
  font-family:var(--serif); font-size:14px; letter-spacing:.1em;
  background:var(--ink); color:var(--paper); border:1px solid var(--ink);
  padding:0 20px; cursor:pointer;
}
.samples{ display:flex; flex-wrap:wrap; gap:7px; margin-top:11px }
.sample{
  font-family:var(--sans); font-size:11.5px; color:var(--ink-soft);
  border:1px solid var(--line); padding:3px 9px; cursor:pointer; background:none;
}
.sample:hover{ border-color:var(--rule); color:var(--ink) }
.sample code{ font-family:var(--mono); font-size:11px; color:var(--indigo) }
.sample .cat{ color:var(--ink) }
.sample .sep{ color:var(--ink-mute); padding:0 3px }
.srch-hint{ font-family:var(--sans); font-size:11.5px; color:var(--ink-mute); margin-top:8px; line-height:1.6 }

/* 按类别浏览：章 → 4 位 heading → 6 位子目 → 8/10 位税则行 */
.bbtn{
  font-family:var(--sans); font-size:13px; color:var(--ink-soft);
  border:1px solid var(--line); background:none; padding:0 13px; cursor:pointer;
  white-space:nowrap;
}
.bbtn:hover{ border-color:var(--rule); color:var(--ink) }
.bbtn[aria-expanded="true"]{ background:var(--ink); color:var(--paper); border-color:var(--ink) }
.browse{ display:none; margin-top:12px; border:1px solid var(--rule); background:var(--paper-2) }
.browse.on{ display:block }
.browse .bh{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  border-bottom:1px solid var(--line-hair); padding:9px 12px;
}
.browse .bh .bt{ font-family:var(--serif); font-size:14px; font-weight:600 }
.browse .crumb{ font-family:var(--mono); font-size:10.5px; color:var(--ink-mute) }
.browse .crumb b{ color:var(--ink); font-weight:400 }
.browse .crumb span{ cursor:pointer; border-bottom:1px dotted var(--line) }
.browse .crumb span:hover{ color:var(--indigo); border-color:var(--indigo) }
.browse .bx{ margin-left:auto; border:none; background:none; cursor:pointer;
  font-family:var(--mono); font-size:11px; color:var(--ink-mute) }
.bfilt{
  width:100%; border:none; border-bottom:1px solid var(--line-hair); background:transparent;
  font-family:var(--sans); font-size:12.5px; color:var(--ink); padding:8px 12px;
}
.bfilt:focus{ outline:none; border-bottom-color:var(--indigo) }
.blist{ max-height:320px; overflow:auto; padding:4px 0 }
.brow{
  display:flex; gap:10px; align-items:baseline; width:100%; text-align:left;
  border:none; background:none; cursor:pointer; padding:6px 12px;
  font-family:var(--sans); font-size:12.5px; color:var(--ink-soft); line-height:1.5;
}
.brow:hover{ background:var(--paper-3); color:var(--ink) }
.brow .bc{ font-family:var(--mono); font-size:11px; color:var(--indigo); flex:0 0 auto }
.brow .bn{ flex:1 1 auto; min-width:0 }
.brow .bg{ flex:0 0 auto; font-family:var(--mono); font-size:10.5px; color:var(--ink-mute) }
.brow.lv0 .bc{ flex:0 0 26px }
.bnote{
  border-top:1px solid var(--line-hair); padding:8px 12px;
  font-family:var(--sans); font-size:11px; color:var(--ink-mute); line-height:1.6;
}
@media (max-width:640px){
  .blist{ max-height:260px }
  .brow{ flex-wrap:wrap }
}

/* ---------- 用法引导（三步 + 读法图例） ---------- */
.howto{ display:flex; flex-wrap:wrap; gap:0 16px; margin:18px 0 0 }
.howto .step{ flex:1 1 170px; border-top:1px solid var(--rule); padding:9px 0 0; margin-bottom:10px }
.howto .step .n{ font-family:var(--mono); font-size:10px; letter-spacing:.12em; color:var(--vermilion) }
.howto .step .hh{ font-family:var(--serif); font-size:14px; margin:4px 0 3px }
.howto .step .dd{ font-family:var(--sans); font-size:11.5px; color:var(--ink-soft); line-height:1.55 }
.guide{ margin:6px 0 0; border:1px solid var(--line); background:var(--paper-2) }
.guide>summary{
  font-family:var(--serif); font-size:13.5px; padding:10px 14px; cursor:pointer;
  list-style:none; display:flex; gap:8px; align-items:baseline;
}
.guide>summary::-webkit-details-marker{ display:none }
.guide>summary .mk{ font-family:var(--mono); color:var(--indigo); font-size:12px }
.guide .gbody{
  padding:0 14px 14px; font-family:var(--sans); font-size:12px;
  color:var(--ink-soft); line-height:1.7;
}
.guide .gsec{ margin:0 0 11px }
.guide .gsec b{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.1em;
  color:var(--ink); display:block; margin-bottom:3px;
}
.guide ul{ margin:0; padding-left:17px }
.guide li{ margin:2px 0 }

/* ---------- 结果顶部结论句 ---------- */
.sumline{
  border-left:3px solid var(--rule); padding:9px 0 9px 13px; margin:16px 0 2px;
  font-family:var(--serif); font-size:15.5px; line-height:1.62;
}
.sumline em{ font-style:normal; font-family:var(--mono); font-size:13.5px; color:var(--vermilion) }
.sumline .tail{ font-family:var(--sans); font-size:11.5px; color:var(--ink-mute); display:block; margin-top:5px; line-height:1.6 }
.sumline .jump{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.08em;
  background:none; border:1px solid var(--line); color:var(--ink-soft);
  padding:3px 9px; cursor:pointer; display:inline-block; margin-top:9px;
}
.sumline .jump:hover{ border-color:var(--rule); color:var(--ink) }

/* ---------- 栏目 ---------- */
.doc{ margin-top:30px }
.doc-head{ border-bottom:3px double var(--rule); padding-bottom:12px; margin-bottom:20px }
.refline{
  font-family:var(--mono); font-size:10.5px; color:var(--ink-mute);
  letter-spacing:.04em; display:flex; flex-wrap:wrap; gap:0 12px;
}
.doc-title{
  font-family:var(--serif); font-size:23px; line-height:1.42; margin:9px 0 6px; font-weight:600;
}
.doc-path{ font-family:var(--sans); font-size:12.5px; color:var(--ink-mute); line-height:1.6 }
.doc-path span{ color:var(--ink-soft) }
.doc-path i{ font-style:normal; color:var(--ink-mute); padding:0 5px }

.col{ margin:24px 0 0; padding-top:13px; border-top:1px solid var(--rule) }
.col-head{ display:flex; align-items:baseline; gap:10px; margin-bottom:12px; flex-wrap:wrap }
.col-tag{
  font-family:var(--mono); font-size:9.5px; letter-spacing:.12em;
  border:1px solid var(--rule); padding:2px 6px; color:var(--ink);
}
.col-name{ font-family:var(--serif); font-size:15px; font-weight:600; letter-spacing:.04em }
.col-src{ font-family:var(--mono); font-size:10px; color:var(--ink-mute); margin-left:auto }

/* ---------- 层分组：把 L1（快照）与 L2（实时）做成两块可折叠的独立区域 ----------
   粗色条只在折叠态出现（用于一眼区分 L1/L2），展开后去掉、只留 1px 细边框；
   展开态的区分靠层标数字与导语。 */
.lgroup{ margin:22px 0 0; border:1px solid var(--line); background:var(--paper-2); padding-bottom:14px }
.lgroup.l1g:not([open]){ border-left:4px solid var(--rule) }
.lgroup.l2g:not([open]){ border-left:4px solid var(--indigo) }
.lgroup>summary{
  list-style:none; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
  padding:11px 13px; cursor:pointer;
}
.lgroup>summary::-webkit-details-marker{ display:none }
.lgroup>summary:hover{ background:var(--paper-3) }
.lg-tag{
  font-family:var(--mono); font-size:10px; letter-spacing:.12em;
  border:1px solid var(--rule); padding:2px 7px; color:var(--ink); flex:0 0 auto;
}
.l2g .lg-tag{ border-color:var(--indigo); color:var(--indigo) }
.lg-name{ font-family:var(--serif); font-size:15px; font-weight:600; letter-spacing:.03em }
.lg-fig{ font-family:var(--mono); font-size:10.5px; color:var(--ink-mute); margin-left:auto }
.lg-mk{ font-family:var(--mono); font-size:12px; color:var(--indigo); flex:0 0 auto }
.lg-lead{
  font-family:var(--sans); font-size:11.5px; color:var(--ink-mute); line-height:1.65;
  padding:2px 13px 11px; border-bottom:1px solid var(--line-hair);
}
/* L2 实时/快照状态：折叠态的层标旁也点一枚小徽标（哪怕分组收起也能看到数据新鲜度） */
.lg-src{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; flex:0 0 auto;
  padding:2px 7px; border-radius:10px; border:1px solid var(--line); color:var(--ink-mute);
}
.lg-src.live{ color:var(--ok); border-color:var(--ok); background:color-mix(in srgb, var(--ok) 9%, transparent) }
.lg-src.snap{ color:var(--warn); border-color:var(--warn); background:color-mix(in srgb, var(--warn) 11%, transparent) }
/* 展开后的数据来源条：方案 B「数据龄提示」主入口 */
.fr-prov{
  font-family:var(--sans); font-size:11px; line-height:1.6; padding:9px 13px;
  border-bottom:1px solid var(--line-hair);
}
.fr-prov.live{ color:var(--ink-soft) }
.fr-prov.snap{ color:var(--warn) }
.fr-prov.stale{ color:var(--vermilion); font-weight:600 }
.lgroup .col{ margin:0; padding-top:14px; padding-left:13px; padding-right:13px; border-top:none }
.lgroup .col + .col{ border-top:1px solid var(--line-hair); margin-top:16px; padding-top:16px }
.lgroup .annot{ margin-left:13px; margin-right:13px }
/* 参考测算：默认展开，放在结论之后 —— 并明确写出每个输入值来自哪里 */
.calc-src{
  font-family:var(--sans); font-size:11.5px; color:var(--ink-mute); line-height:1.7;
  border-left:2px solid var(--line); padding:2px 0 2px 11px; margin:0 0 12px;
}
.calc-src b{ color:var(--ink-soft); font-weight:600 }
.calcexcl{
  font-family:var(--sans); font-size:11px; color:var(--vermilion);
  line-height:1.65; margin-top:10px; border-top:1px solid var(--line-hair); padding-top:9px;
}

/* 竖细线分隔的字段栏 */
.fields{ display:flex; flex-wrap:wrap; gap:0; border-top:1px solid var(--line-hair) }
.field{ padding:11px 0; flex:1 1 33%; min-width:140px; border-left:1px solid var(--line-hair); padding-left:13px }
.field:first-child{ border-left:none; padding-left:0 }
.field .k{ font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; color:var(--ink-mute) }
.field .v{ font-family:var(--serif); font-size:17px; margin-top:3px; word-break:break-word }
.field .v.sm{ font-size:13px; font-family:var(--sans); color:var(--ink-soft) }

/* 表格：双 rule line 表头、无斑马纹、无圆角 */
table{ width:100%; border-collapse:collapse; margin:4px 0 0 }
th{
  font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; font-weight:500;
  text-align:left; color:var(--ink); padding:6px 9px 6px 0;
  border-top:1px solid var(--rule); border-bottom:1px solid var(--line);
}
td{
  font-family:var(--serif); font-size:14px; padding:8px 9px 8px 0;
  border-bottom:1px solid var(--line-hair); vertical-align:top;
}
td.m{ font-family:var(--mono); font-size:12px }
th+th, td+td{ padding-left:12px; border-left:1px solid var(--line-hair) }

/* 置信度四级 */
.t0{ border-left:2px solid var(--rule); padding-left:12px }
.t1{ border-left:2px solid var(--amber); padding-left:12px; background:linear-gradient(90deg,rgba(216,180,92,.09),transparent 60%) }
.t2{ border:1px dashed var(--ink-mute); padding:9px 12px; color:var(--ink-mute) }
.t3{ border-left:3px solid var(--vermilion); padding-left:12px }
.tierlab{
  font-family:var(--mono); font-size:9px; letter-spacing:.1em; color:var(--ink-mute);
  display:block; margin-bottom:2px;
}
.t3 .tierlab{ color:var(--vermilion) }
.t1 .tierlab{ color:var(--amber) }

/* 勘校旁注（红线） */
.annot{
  margin:14px 0; padding:13px 15px;
  border-left:5px solid var(--vermilion); background:var(--paper-2);
}
.annot .ah{
  font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:var(--vermilion);
  margin-bottom:5px;
}
.annot .at{ font-family:var(--serif); font-size:16px; font-weight:600; line-height:1.5; margin-bottom:6px }
.annot .ad{ font-family:var(--sans); font-size:12.5px; color:var(--ink-soft); line-height:1.68 }
.annot .ad code{ font-family:var(--mono); font-size:11.5px; background:var(--paper-3); padding:1px 4px }
.annot.muted{ border-left-color:var(--amber); background:none; border-top:1px solid var(--line-hair); border-bottom:1px solid var(--line-hair); border-left-width:5px }
.annot.muted .ah{ color:var(--amber) }

/* 出处引用 —— 最大字号（#11：按证据强度排版，出处才是主角） */
.cite{ margin:0 0 17px; padding-bottom:13px; border-bottom:1px solid var(--line-hair) }
.cite:last-child{ border-bottom:none }
.cite .ct{
  font-family:var(--serif); font-size:18.5px; line-height:1.44; font-weight:600;
}
.cite .ct a{ color:var(--ink); text-decoration:none; border-bottom:1px solid var(--indigo) }
.cite .ct a:hover{ color:var(--indigo) }
.cite .cb{
  font-family:var(--mono); font-size:10.5px; color:var(--ink-mute);
  margin-top:5px; display:flex; flex-wrap:wrap; gap:0 11px;
}
.cite .cb .ag{ color:var(--ink-soft) }
.cite .cs{ font-family:var(--sans); font-size:12.5px; color:var(--ink-soft); margin-top:6px; line-height:1.62 }
.cite .ch{ font-family:var(--mono); font-size:10px; color:var(--ink-mute); margin-top:4px }
.badge{
  font-family:var(--mono); font-size:9px; letter-spacing:.08em;
  border:1px solid var(--line); padding:1px 5px; color:var(--ink-soft);
}
.badge.strong{ border-color:var(--rule); color:var(--ink) }
.badge.weak{ border-style:dashed; color:var(--ink-mute) }

/* 附加措施条目 */
.m99{ padding:11px 0; border-bottom:1px solid var(--line-hair) }
.m99 .h{ font-family:var(--mono); font-size:12.5px; color:var(--ink) }
.m99 .nm{ font-family:var(--sans); font-size:12.5px; color:var(--ink-soft); margin-top:3px; line-height:1.55 }
.m99 .rt{ font-family:var(--mono); font-size:11px; color:var(--ink-mute); margin-top:4px }
.m99 .rt .add{ color:var(--vermilion) }

.empty{
  font-family:var(--sans); font-size:12.5px; color:var(--ink-mute);
  padding:11px 0; line-height:1.68;
}
.empty b{ color:var(--ink-soft) }

/* 空态：首屏不预跑查询，先告诉读者「这里会发生什么」 */
.idle{ border-top:3px double var(--rule); border-bottom:1px solid var(--line); padding:18px 0 16px; margin-top:4px }
.idle .kicker{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--vermilion); margin-bottom:8px;
}
.idle .lede{
  font-family:var(--serif); font-size:17px; line-height:1.62; color:var(--ink);
  max-width:34em; margin:0 0 4px;
}
.idle .lede em{ font-style:normal; border-bottom:1px solid var(--indigo); color:var(--indigo) }
.idle .sub{ font-family:var(--sans); font-size:12.5px; color:var(--ink-mute); line-height:1.7; margin:0 0 14px }
.idle .will{ list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:0 22px }
.idle .will li{
  flex:1 1 190px; border-top:1px solid var(--line-hair); padding:9px 0 0; margin-bottom:10px;
  font-family:var(--sans); font-size:12px; line-height:1.6; color:var(--ink-soft);
}
.idle .will b{ display:block; font-family:var(--mono); font-size:10.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink); margin-bottom:3px }

/* 参考测算 —— 默认折叠（#10） */
.calc{ margin:26px 0 0; border:1px solid var(--line); background:var(--paper-2) }
.calc summary{
  cursor:pointer; padding:13px 15px; list-style:none;
  font-family:var(--serif); font-size:15px; font-weight:600;
  display:flex; align-items:baseline; gap:10px;
}
.calc summary::-webkit-details-marker{ display:none }
.calc summary::before{ content:"＋"; font-family:var(--mono); font-size:13px; color:var(--ink-mute) }
.calc[open] summary::before{ content:"－" }
.calc summary .hint{ font-family:var(--mono); font-size:9.5px; letter-spacing:.08em; color:var(--ink-mute); margin-left:auto; font-weight:400 }
.calc-body{ padding:0 15px 16px; border-top:1px solid var(--line-hair) }

<script>
"use strict";

/* ============================================================
   一、数据层（与 verify.html 同源，已通过端到端验证）
   ============================================================ */
const DATA = "data/";
const TAG  = "2026rev9";
const FRSTAMP = "20260928";
const cache = new Map();

/* 托管平台差异兜底：GitHub Pages / CDN 可能原样透传 gzip 字节，也可能代理解压
   （返回 Content-Encoding: gzip）。按 gzip magic bytes 判断走哪条路，
   避免换托管环境后整站取不到数据。 */
async function decodeMaybeGzip(buf, name){
  const head = new Uint8Array(buf.slice(0, 2));
  if (!(head[0] === 0x1f && head[1] === 0x8b))
    return new TextDecoder().decode(buf);            // 平台已解压 → 裸 JSON
  if (typeof DecompressionStream === "undefined")
    throw new Error(t("errNoDecompression"));
  const ds = new DecompressionStream("gzip");
  return await new Response(new Blob([buf]).stream().pipeThrough(ds)).text();
}

async function gunzipFile(name){
  if (cache.has(name)) return cache.get(name);
  const res = await fetch(DATA + name);
  if (!res.ok) throw new Error(name + " HTTP " + res.status);
  const buf = await res.arrayBuffer();
  const obj = JSON.parse(await decodeMaybeGzip(buf, name));
  cache.set(name, obj);
  return obj;
}
async function loadPlain(name){
  if (cache.has(name)) return cache.get(name);
  const res = await fetch(DATA + name);
  if (!res.ok) throw new Error(name + " HTTP " + res.status);
  const obj = await res.json();
  cache.set(name, obj);
  return obj;
}

const dg  = s => (s || "").replace(/\D/g, "");
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));

const STOP = new Set(("the a an of and or for in to with not over other than each valued provided subheadings headings "+
  "subheading heading nos containing weight percent more less there their from into such any which these those "+
  "whether including parts thereof articles goods products wares items having being been was were are its it "+
  "all some most least highest lowest value values total net gross unit units number numbers").split(/\s+/));

/* 税率形态码 —— 对应红线 02 */
const RK = {
  p: "advalorem", s: "specific", c: "compound", f: "free", t: "textref", e: "empty"
};

async function lookupHS(hs){
  const d = dg(hs);
  if (d.length < 4) throw new Error(t("errShortCode"));
  const ch = d.slice(0, 2);
  const shard = await gunzipFile("hts-" + TAG + "-ch" + ch + ".json.gz");
  let row = shard.rows.find(r => dg(r.h) === d);
  let kind = "exact";
  if (!row){
    const c = shard.rows.filter(r => dg(r.h).startsWith(d));
    if (c.length){ row = c[0]; kind = "prefix"; }
  }
  if (!row) return { found:false, digits:d };
  return { found:true, row, kind, digits:d, chapter:ch, shardSize:shard.rows.length };
}

async function findCh99(d){
  const [c99, refs] = await Promise.all([
    gunzipFile("hts-" + TAG + "-ch99.json.gz"),
    gunzipFile("hts-" + TAG + "-ch99refs.json.gz")
  ]);
  const out = [];
  for (const k in refs.refs){
    if (d.startsWith(k) || k.startsWith(d)){
      for (const i of refs.refs[k]) out.push({ idx:i, row:c99.rows[i], via:k });
    }
  }
  const seen = new Set();
  return out.filter(x => !seen.has(x.idx) && seen.add(x.idx));
}

/* 关键词两级化：self（叶子自身描述，特异性高）> path（祖先链通用词）。
   混排会让电池的关键词变成 rectangular / separators，命中一堆钢管反倾销案。 */
function kwSets(row){
  const grab = s => [...new Set(((s || "").toLowerCase().match(/[a-z]{5,}/g) || []))].filter(w => !STOP.has(w));
  const byLen = a => a.slice().sort((x,y) => y.length - x.length);
  const sSelf = new Set(grab(row.d));
  const path  = grab((row.p || []).join(" ")).filter(w => !sSelf.has(w));
  return { self: byLen([...sSelf]).slice(0,5), path: byLen(path).slice(0,6),
           all: byLen([...sSelf].concat(path)).slice(0,10) };
}
function scoreHit(bl, K){
  const hs = K.self.filter(w => bl.includes(w));
  const hp = K.path.filter(w => bl.includes(w));
  if (hs.length >= 2) return { s:3, hit:hs.concat(hp) };
  if (hs.length === 1) return { s:2, hit:hs.concat(hp) };
  if (hp.length >= 2)  return { s:1, hit:hp };
  return null;
}
function matchFR(row, d, docs){
  const K = kwSets(row);
  const out = [];
  for (const x of docs){
    const blob = x.t + " " + (x.ab || "");
    if (dg(blob).includes(d)){ out.push({ s:4, doc:x, hit:[] }); continue; }
    const r = scoreHit(blob.toLowerCase(), K);
    if (r) out.push({ s:r.s, doc:x, hit:r.hit });
  }
  out.sort((a,b) => b.s - a.s || String(b.doc.pub).localeCompare(String(a.doc.pub)));
  return { kw:K.all, K, hits:out, total:docs.length };
}

/* ADD/CVD：强 = 编码索引；弱 = 品名关键词。
   3,808 条里只有 133 条（3.5%）能抽出 HS 码，只走强路径会漏掉绝大多数。 */
async function findADCVD(d, row, adData){
  const ad = adData;
  const byNo = new Map(ad.docs.map(x => [x.no, x]));
  const seen = new Set();
  const strong = [];
  for (const k in ad.hs_index){
    if (d.startsWith(k) || k.startsWith(d)){
      for (const no of ad.hs_index[k]){
        if (!seen.has(no)){ seen.add(no); strong.push(Object.assign({ via:k }, byNo.get(no) || { no })); }
      }
    }
  }
  const K = kwSets(row);
  const weak = [];
  for (const x of ad.docs){
    if (seen.has(x.no)) continue;
    const r = scoreHit((x.t || "").toLowerCase(), K);
    if (r){ seen.add(x.no); weak.push(Object.assign({ hit:r.hit, s:r.s }, x)); }
  }
  weak.sort((a,b) => (b.s - a.s) || String(b.pub || "").localeCompare(String(a.pub || "")));
  return { strong, weak, kw:K.all };
}
/* 按产品名聚合：同一产品各国案件/各阶段会重复几十条，摊平会把提示稀释成流水 */
function groupByProduct(docs){
  const g = new Map();
  for (const x of docs){
    let name = (x.t || "").split(/\s+From\s+/i)[0];
    name = name.split(/[;:]/)[0].trim() || (x.t || "").slice(0, 60);
    if (!g.has(name)) g.set(name, []);
    g.get(name).push(x);
  }
  return [...g.entries()].map(([name, arr]) => ({
    name, n: arr.length,
    latest: arr.map(x => x.pub || "").sort().pop(),
    hit: [...new Set(arr.flatMap(x => x.hit || []))].slice(0, 3),
    sample: arr.slice().sort((a,b) => String(b.pub||"").localeCompare(String(a.pub||"")))[0]
  })).sort((a,b) => b.n - a.n);
}

/* ---- L2 实时层：浏览器直连 Federal Register API，失败时回退本地快照 ----
   红线 03：只取「公告 / 案件存在性」，不计算金额。
   - 首次查询尝试浏览器直连（免密钥、HTTPS）；
   - 任何失败（CORS 拦截、网络不可达、429 限速、13s 超时）即回退构建期快照 gz；
   - 直连成功一次后整会话复用（免重复抓取）；失败一次后整会话不再重试 live。 */
const FR_API = "https://www.federalregister.gov/api/v1/documents.json";
const FR_FIELDS = ["document_number","title","type","publication_date",
  "effective_on","comments_close_on","agencies","abstract","html_url",
  "citation","action"];
const FR_HS_RE = /\b(\d{4}\.\d{2}(?:\.\d{2}){0,2})\b/g;

function frSlim(r){
  return { no:r.document_number, t:(r.title||"").trim(), ty:r.type, pub:r.publication_date,
    eff:r.effective_on, close:r.comments_close_on,
    ag:(r.agencies||[]).map(a=>a.name), ab:(r.abstract||"").trim(),
    url:r.html_url, cite:r.citation, act:r.action };
}
function frExtractHS(text){
  const out = new Set(), s = text || ""; FR_HS_RE.lastIndex = 0; let m;
  while ((m = FR_HS_RE.exec(s))) out.add(m[1].replace(/\D/g, ""));
  return [...out];
}
function frProductName(title){
  const head = (title||"").split(/\s+From\s+/i)[0];
  return head.split(/[;:]/)[0].trim();
}
async function frQueryLive(term, sinceISO, maxPages, signal){
  const docs = []; let page = 1;
  while (page <= maxPages){
    const p = new URLSearchParams();
    p.set("per_page","1000"); p.set("page", String(page)); p.set("order","newest");
    p.set("conditions[term]", term);
    p.set("conditions[publication_date][gte]", sinceISO);
    FR_FIELDS.forEach(f => p.append("fields[]", f));
    const res = await fetch(FR_API + "?" + p.toString(), { signal, headers:{ "Accept":"application/json" } });
    if (!res.ok) throw new Error("FR HTTP " + res.status);
    const data = await res.json();
    const results = data.results || [];
    for (const r of results) docs.push(frSlim(r));
    if (!results.length) break;
    if (docs.length >= (data.count||0)) break;
    page++;
    if (page <= maxPages) await new Promise(r => setTimeout(r, 300));
  }
  return docs;
}
async function fetchLiveFR(signal){
  const since90 = new Date(Date.now() - 90*864e5).toISOString().slice(0,10);
  const sinceAD = new Date(Date.now() - 1095*864e5).toISOString().slice(0,10);
  const tariff = await frQueryLive("Harmonized Tariff Schedule", since90, 8, signal);
  const seen = new Set(), adDocs = [];
  for (const term of ["antidumping","countervailing duty"]){
    const rs = await frQueryLive(term, sinceAD, 16, signal);
    for (const r of rs){
      if (seen.has(r.no)) continue; seen.add(r.no);
      r.hs = frExtractHS(r.t + " " + (r.ab||""));
      r.pn = frProductName(r.t);
      adDocs.push(r);
    }
  }
  const hsIndex = {};
  for (const x of adDocs) for (const c of x.hs) (hsIndex[c] = hsIndex[c] || []).push(x.no);
  return { tariff, adDocs, hsIndex };
}

/* 缓存：live 成功一次整会话复用；snapshot 失败一次整会话不再重试 live */
let _frCache = null;
async function loadFR(d, row){
  if (_frCache && _frCache.status === "live")    return _buildFR(d, row, _frCache, "live");
  if (_frCache && _frCache.status === "snapshot") return _buildFR(d, row, _frCache, "snapshot");
  let ctrl = null, timer = null, signal = undefined;
  if (typeof AbortController !== "undefined"){
    ctrl = new AbortController(); timer = setTimeout(() => ctrl.abort(), 13000); signal = ctrl.signal;
  }
  try {
    const live = await fetchLiveFR(signal);
    _frCache = Object.assign({ status:"live", fetchedAt: new Date().toISOString() }, live);
    return _buildFR(d, row, _frCache, "live");
  } catch (e){
    try {
      const [tax, ad] = await Promise.all([
        gunzipFile("fr-tariff-" + FRSTAMP + ".json.gz"),
        gunzipFile("fr-adcvd-" + FRSTAMP + ".json.gz")
      ]);
      _frCache = { status:"snapshot", tariff:tax.docs, adDocs:ad.docs, hsIndex:ad.hs_index,
        snapshotStamp:FRSTAMP, snapshotFetchedAt:tax.fetched_at, err:String(e.message||e) };
      return _buildFR(d, row, _frCache, "snapshot");
    } catch (e2){
      throw new Error(t("errFRBoth") + " (" + (e.message||e) + ")");
    }
  } finally { if (timer) clearTimeout(timer); }
}
async function _buildFR(d, row, fr, source){
  const adcvd = await findADCVD(d, row, { docs: fr.adDocs, hs_index: fr.hsIndex });
  return {
    fr: matchFR(row, d, fr.tariff),
    adcvd,
    source,
    fetchedAt: fr.fetchedAt || fr.snapshotFetchedAt,
    frCount: fr.tariff.length,
    adcvdCount: fr.adDocs.length,
    adcvdWithHs: Object.keys(fr.hsIndex).length,
    snapshotStamp: fr.snapshotStamp,
    err: fr.err
  };
}
function frDataAgeDays(stamp){
  if (!stamp) return null;
  const y = +stamp.slice(0,4), mo = +stamp.slice(4,6) - 1, d = +stamp.slice(6,8);
  const then = new Date(y, mo, d);
  return Math.max(0, Math.floor((Date.now() - then.getTime()) / 864e5));
}

/* ============================================================
   二、双语（中文为源语言，硬约束：先快照再切换）
   ============================================================ */
let LANG = "zh-CN";
const I18N = {

    exact: "精确匹配", prefix: "前缀回退", inherit: "继承自", thisRow: "本行",
    tierT0: "T0 · 数据源原文", tierT1: "T1 · 需复核", tierT2: "T2 · 数据缺失",

/* 叶子自身的描述常是 "Other" / "Of a thickness of…" 这类无辨识度的后缀，
   直接当标题会让页面读起来像 "Other"。此时回退到祖先链最后一个有意义的品名段。
   例：0201.10.50 的 self="Other"，路径末段="Carcasses and half-carcasses"。 */
function displayName(row){
  const p = (row.p || []).map(s => String(s).replace(/[:：]\s*$/, "").trim()).filter(Boolean);
  const self = (row.d || "").trim();
  const generic = !self || self.length < 12 || /^others?\.?$/i.test(self.replace(/[.。]+$/, ""));
  if (generic && p.length) return p[p.length - 1] + " — " + self;
  return self || p[p.length - 1] || "—";
}

function annot(tag, title, body, muted){
  return `<div class="annot${muted ? " muted" : ""}">
    <div class="ah">${esc(tag)}</div>
    <div class="at">${esc(title)}</div>
    <div class="ad">${body}</div></div>`;
}

function render(res){
  const { base, ch99, fr, adcvd, frBundle } = res;
  const row = base.row, d = base.digits;
  const isFree = row.rk === "f";
  const snapClean = isFree && ch99.length === 0;
  const l1Rules = fr.hits.filter(x => x.doc.ty === "Rule" || x.doc.ty === "Presidential Document");
  let h = "";

  /* ---- 卷宗抬头 ---- */
  h += `<div class="doc-head">
    <div class="refline">
      <span>${esc(t("ref"))}: TL-${esc(d)}</span>
      <span>${esc(t("queriedAt"))} ${new Date().toISOString().slice(0,10)}</span>
      <span>${esc(t("dataVer"))} ${esc(TAG)}</span>
    </div>
    <div class="doc-title">${esc(displayName(row))}</div>
    <div class="doc-path">${(row.p || []).map(esc).join(" <i>›</i> ") || "—"}<i>›</i><span>${esc(row.d || "—")}</span></div>
  </div>`;

  /* ---- 结论句：结果的第一行先给「结论」，再给证据 ---- */
  const rateTxt = (row.rk === "p" || row.rk === "f") && row.g
    ? t("sumBase", { r: row.g })
    : t("sumNoPct");
  const adHit = (adcvd.strong && adcvd.strong.length) || (adcvd.weak && adcvd.weak.length);
  const sum = rateTxt
    + (ch99.length ? t("sumCh99", { n:String(ch99.length) }) : t("sumCh99z"))
    + (adHit ? t("sumAD") : t("sumADz"));
  h += `<div class="sumline">${esc(sum)}<span class="tail">${esc(t("sumTail"))}</span>` +
       `<button type="button" class="jump" id="calcJump">${esc(t("calcJump"))}</button></div>`;

  /* ---- 勘校旁注 ---- */
  if (snapClean && fr.hits.length){
    h += annot(t("ann01"), t("ann01t"),
      t("ann01d", { n:String(fr.hits.length),
        rule: l1Rules.length ? t("ann01rule", { n:String(l1Rules.length) }) : "" }));
  }
  if (row.rk === "t")
    h += annot(t("ann02"), t("ann02t"), t("ann02d", { v: esc(row.g.slice(0,90)) }));
  /* 红线 03 是常态提示（每次查询都成立），用 muted 以免与红线 01 抢朱红 */
  h += annot(t("ann03"), t("ann03t"), t("ann03d"), true);

  /* ---- 参考测算：默认折叠（#10） ---- */
  /* Free 是有确定答案的（基础税 $0），不是「算不了」；
     从量 / 复合 / 文本引用 / 空 才是算不了 —— 后者才走 T2「不出数字」。 */
  const pct = row.rk === "p" ? parseFloat(String(row.g).replace(/[^\d.]/g, ""))
            : row.rk === "f" ? 0 : null;
  h += `<details class="calc" id="calcBox" open>
    <summary>${esc(t("calcSummary"))}<span class="hint">${esc(t("calcHint"))}</span></summary>
    <div class="calc-body">
      <div class="calc-src">${t("calcSrcNote")}</div>
      <div class="calcrow">
        <div><label>${esc(t("calcValue"))}</label><input type="number" id="val" value="100000" min="0" step="1000"></div>
        <div><label>${esc(t("calcMode"))}</label><select id="mode">
          <option value="ocean">${esc(t("calcModeOcean"))}</option>
          <option value="air">${esc(t("calcModeAir"))}</option></select></div>
        <div><label>MPF %</label><input type="number" id="mpf" value="0.3464" step="0.0001"></div>
        <div><label>MPF min $</label><input type="number" id="mpfmin" value="33.58" step="0.01"></div>
        <div><label>MPF max $</label><input type="number" id="mpfmax" value="651.50" step="0.01"></div>
        <div><label>HMF %</label><input type="number" id="hmf" value="0.125" step="0.001"></div>
        <div><button id="calcBtn">${esc(t("calcBtn"))}</button></div>
      </div>
      <div id="calcout"></div>
      <div class="calcnote">${t("calcNote")}</div>
    </div></details>`;

  /* ---- L1 分组：快照层（基础税率 + Chapter 99），默认折叠，点标题展开 ---- */
  h += `<details class="lgroup l1g">
    <summary><span class="lg-tag">L1</span>
      <span class="lg-name">${esc(t("l1Name"))}</span>
      <span class="lg-fig">${esc(t("l1Fig", { r: row.g || "—", n: String(ch99.length) }))}</span>
      <span class="lg-mk">＋</span></summary>
    <div class="lg-lead">${esc(t("l1Lead"))}</div>`;

  /* ---- L1 基础税率 ---- */
  const tier = row.rk === "t" || row.rk === "e" ? "t1" : "t0";
  const tierLab = tier === "t0" ? t("tierT0") : t("tierT1");
  h += `<div class="col">
    <div class="col-head"><span class="col-tag">L1</span>
      <span class="col-name">${esc(t("colBase"))}</span>
      <span class="col-src">${esc(t("colBaseSrc"))}</span></div>
    <div class="${tier}">
      <span class="tierlab">${esc(tierLab)}</span>
      <table>
        <tr><th>${esc(t("kGeneral"))}</th><th>${esc(t("kSpecial"))}</th><th>${esc(t("kCol2"))}</th></tr>
        <tr><td class="m">${esc(row.g || "—")}</td>
            <td class="m" style="font-size:11.5px">${esc((row.s || "—").slice(0,120))}</td>
            <td class="m">${esc(row.o || "—")}</td></tr>
      </table>
    </div>
    <div class="fields" style="margin-top:12px">
      <div class="field"><div class="k">${esc(t("kForm"))}</div><div class="v sm">${esc(t("form" + row.rk.toUpperCase()))}</div></div>
      <div class="field"><div class="k">${esc(t("kMatch"))}</div><div class="v sm">${esc(base.kind === "prefix" ? t("prefix") : t("exact"))}</div></div>
      <div class="field"><div class="k">${esc(t("kRateSrc"))}</div><div class="v sm">${row.gi ? esc(t("inherit")) + " " + esc(row.gi) : esc(t("thisRow"))}</div></div>
    </div></div>`;
  if (base.kind === "prefix")
    h += annot(t("tierT1"), t("prefix"), `输入 <code>${esc(d)}</code> 在本章分片中无精确对应，已回退到前缀匹配的第一个子目 <code>${esc(row.h)}</code>。请以实际申报编码复核。`, true);

  /* ---- L1 Chapter 99 ---- */
  h += `<div class="col">
    <div class="col-head"><span class="col-tag">L1</span>
      <span class="col-name">${esc(t("col99"))}</span>
      <span class="col-src">${esc(t("col99Src"))} · ${ch99.length} ${esc(t("rules"))}</span></div>`;
  if (!ch99.length){
    h += `<div class="t2"><span class="tierlab">${esc(t("tierT2"))}</span>${t("empty99")}</div>`;
  } else {
    h += annot(t("ann99"), t("ann99t", { n:String(ch99.length) }), t("ann99d"), true);
    h += `<div class="t3"><span class="tierlab">${esc(t("tierT3"))}</span>`;
    h += ch99.slice(0, 12).map(x => {
      const r = x.row;
      const nm = (r.p && r.p.length) ? r.p.join(" › ") : r.d;
      return `<div class="m99"><div class="h">${esc(r.h)}</div>
        <div class="nm">${esc(nm.slice(0,170))}${nm.length > 170 ? "…" : ""}</div>
        <div class="rt">general ${esc(r.g || "—")}${r.a ? ` · <span class="add">additionalDuties ${esc(String(r.a).slice(0,90))}</span>` : ""} · via ${esc(x.via)}</div></div>`;
    }).join("");
    if (ch99.length > 12) h += `<div class="empty">${t("moreN", { n:String(ch99.length - 12) })}</div>`;
    h += `</div>`;
  }
  h += `</div></details>`;

  /* ---- L2 分组：实时层（联邦公报 + ADD/CVD），默认折叠，点标题展开 ---- */
  const adProds = groupByProduct(adcvd.strong).length + groupByProduct(adcvd.weak).length;
  const fb = frBundle || { source:"snapshot" };
  const frAge = frDataAgeDays(fb.snapshotStamp);
  const provBadge = fb.source === "live" ? t("frLiveBadge") : t("frSnapBadge");
  const provText = fb.source === "live"
    ? t("frProvLive", { a:String(fb.frCount || 0), b:String(fb.adcvdCount || 0),
        t:(fb.fetchedAt || "").slice(11,16) || "—" })
    : t("frProvSnap", { d:(fb.snapshotStamp || "").replace(/(\d{4})(\d{2})(\d{2})/, "$1-$2-$3"),
        n:String(frAge == null ? 0 : frAge), e:String(fb.err || "").slice(0, 60) });
  const provCls = fb.source === "live" ? "live" : ("snap" + (frAge != null && frAge > 14 ? " stale" : ""));
  h += `<details class="lgroup l2g">
    <summary><span class="lg-tag">L2</span>
      <span class="lg-name">${esc(t("l2Name"))}</span>
      <span class="lg-fig">${esc(t("l2Fig", { n:String(fr.hits.length), m:String(adProds) }))}</span>
      <span class="lg-src ${fb.source}">${esc(provBadge)}</span>
      <span class="lg-mk">＋</span></summary>
    <div class="lg-lead">${esc(t("l2Lead"))}</div>
    <div class="fr-prov ${provCls}">${esc(provText)}</div>`;

  /* ---- L2 联邦公报（出处引用给最大字号） ---- */
  h += `<div class="col">
    <div class="col-head"><span class="col-tag">L2</span>
      <span class="col-name">${esc(t("colFR"))}</span>
      <span class="col-src">${esc(t("colFRSrc"))} · ${fr.hits.length}/${fr.total}</span></div>`;
  if (!fr.hits.length){
    h += `<div class="t2"><span class="tierlab">${esc(t("tierT2"))}</span>${t("emptyFR")}</div>`;
  } else {
    h += fr.hits.slice(0, 12).map(x => {
      const c = x.doc;
      return `<div class="cite">
        <div class="ct"><a href="${esc(frUrl(c))}" target="_blank" rel="noopener">${esc(c.t)}</a></div>
        <div class="cb">
          <span class="badge ${x.s >= 3 ? "strong" : x.s === 4 ? "strong" : "weak"}">${esc(x.s === 4 ? t("hitStrong") : x.s >= 2 ? t("hitStrong") : t("hitWeak"))}</span>
          <span>${esc(c.pub || "")}</span>
          <span>${esc(c.ty || "—")}</span>
          ${c.eff ? `<span>eff. ${esc(c.eff)}</span>` : ""}
          ${c.close ? `<span>comments close ${esc(c.close)}</span>` : ""}
          <span class="ag">${esc((c.ag || []).join(" / "))}</span>
        </div>
        ${c.ab ? `<div class="cs">${esc(c.ab.slice(0,220))}${c.ab.length > 220 ? "…" : ""}</div>` : ""}
        ${x.hit && x.hit.length ? `<div class="ch">matched: ${x.hit.map(esc).join(" · ")}</div>` : ""}
      </div>`;
    }).join("");
    if (fr.hits.length > 12) h += `<div class="empty">${t("moreN", { n:String(fr.hits.length - 12) })}</div>`;
  }
  h += `</div>`;

  /* ---- L2′ ADD / CVD ---- */
  const gS = groupByProduct(adcvd.strong), gW = groupByProduct(adcvd.weak);
  h += `<div class="col">
    <div class="col-head"><span class="col-tag">L2′</span>
      <span class="col-name">${esc(t("colAD"))}</span>
      <span class="col-src">${esc(t("colADSrc"))} · ${adcvd.strong.length + adcvd.weak.length} ${esc(t("rules"))} / ${gS.length + gW.length} ${esc(t("products"))}</span></div>`;
  if (!adcvd.strong.length && !adcvd.weak.length){
    h += annot(t("annADnone"), t("annADnonet"), t("annADnoned"), true);
  } else {
    const parts = [];
    if (adcvd.strong.length) parts.push(`<b>${adcvd.strong.length}</b> ${t("hitStrong")}`);
    if (adcvd.weak.length)   parts.push(`<b>${adcvd.weak.length}</b> ${t("hitWeak")}`);
    h += annot(t("annAD"), t("annADt"), t("annADd", { s: parts.join(" + ") }), true);
    h += `<div class="t3"><span class="tierlab">${esc(t("tierT3"))}</span>`;
    const grp = (g, weak) => `<div class="cite">
      <div class="ct"><a href="${esc(frUrl(g.sample))}" target="_blank" rel="noopener">${esc(g.name)}</a></div>
      <div class="cb">
        <span class="badge ${weak ? "weak" : "strong"}">${esc(weak ? t("hitWeak") : t("hitStrong"))}</span>
        <span>${g.n} ${esc(t("rules"))}</span><span>${esc(g.latest)}</span>
        <span class="ag">${esc((g.sample.ag || []).join(" / "))}</span>
      </div>
      ${g.hit.length ? `<div class="ch">matched: ${g.hit.map(esc).join(" · ")}</div>` : ""}
    </div>`;
    if (gS.length) h += gS.map(g => grp(g, false)).join("");
    if (gW.length){
      h += gW.slice(0, 8).map(g => grp(g, true)).join("");
      if (gW.length > 8) h += `<div class="empty">${t("moreProd", { n:String(gW.length - 8), m:String(gW.slice(8).reduce((s,g) => s + g.n, 0)) })}</div>`;
    }
    h += `</div>`;
  }
  h += `</div></details>`;

  /* ---- 溯源 ---- */
  h += `<div class="col"><div class="col-head">
    <span class="col-tag">¶</span><span class="col-name">${esc(t("colChain"))}</span></div>
    <div class="chain" id="chain"></div>
    <div class="calcnote" style="margin-top:8px">${esc(t("chainNote"))}</div></div>`;

  document.getElementById("out").innerHTML = h;

  /* 层分组的展开标记 ＋/− */
  document.querySelectorAll(".lgroup").forEach(d => {
    const mk = d.querySelector(".lg-mk");
    if (!mk) return;
    const sync = () => { mk.textContent = d.open ? "−" : "＋"; };
    d.addEventListener("toggle", sync);
    sync();
  });

  /* 绑定测算（pct 可能为 null → 不出基础税，红线 02） */
  const box = document.getElementById("calcBox");
  const run = () => {
    const v = parseFloat(document.getElementById("val").value) || 0;
    const mode = document.getElementById("mode").value;
    const mr = parseFloat(document.getElementById("mpf").value) || 0;
    const mn = parseFloat(document.getElementById("mpfmin").value) || 0;
    const mx = parseFloat(document.getElementById("mpfmax").value) || 0;
    const hr = parseFloat(document.getElementById("hmf").value) || 0;
    const mpf = Math.min(Math.max(v * mr / 100, mn), mx);
    const hmf = mode === "ocean" ? v * hr / 100 : 0;
    const duty = pct == null ? null : v * pct / 100;
    const usd = n => "$" + n.toLocaleString("en-US", { minimumFractionDigits:2, maximumFractionDigits:2 });
    let o = "";
    if (duty == null){
      o += `<div class="t2" style="margin-bottom:10px"><span class="tierlab">${esc(t("tierT2"))}</span>${t("calcNoPct")}</div>`;
    } else {
      o += `<div class="cline"><span class="lab">${esc(t("calcDuty", { r: row.g }))}</span><span>${usd(duty)}</span></div>`;
    }
    o += `<div class="cline"><span class="lab">${esc(t("calcMPF"))}</span><span>${usd(mpf)}</span></div>`;
    o += `<div class="cline"><span class="lab">${esc(t("calcHMF"))}${mode === "air" ? " · n/a" : ""}</span><span>${usd(hmf)}</span></div>`;
    o += `<div class="cline total"><span class="lab">${esc(t("calcTotal"))}</span><span>${usd((duty || 0) + mpf + hmf)}</span></div>`;
    o += `<div class="calcexcl">${esc(t("calcExcl"))}</div>`;
    document.getElementById("calcout").innerHTML = o;
  };
  document.getElementById("calcBtn").addEventListener("click", run);
  box.addEventListener("toggle", () => { if (box.open && !document.getElementById("calcout").innerHTML) run(); });

  /* 结论行里的跳转：直接展开参考测算并滚动过去 —— 它不再埋在页面底部 */
  const jmp = document.getElementById("calcJump");
  if (jmp) jmp.addEventListener("click", () => {
    box.open = true;
    if (!document.getElementById("calcout").innerHTML) run();
    box.scrollIntoView({ behavior:"smooth", block:"center" });
  });

  renderChain(["hts-" + TAG + "-ch" + base.chapter + ".json.gz",
               "hts-" + TAG + "-ch99.json.gz",
               "hts-" + TAG + "-ch99refs.json.gz",
               "fr-tariff-" + FRSTAMP + ".json.gz",
               "fr-adcvd-" + FRSTAMP + ".json.gz"], frBundle);
}

function renderChain(files, frBundle){
  const el = document.getElementById("chain");
  if (!MANIFEST){ el.innerHTML = ""; return; }
  const all = [].concat((MANIFEST.hts && MANIFEST.hts.files) || [], (MANIFEST.fr && MANIFEST.fr.files) || []);
  const rows = files.map(f => {
    const m = all.find(x => x.file === f);
    const isFR = f.indexOf("fr-") === 0;
    const live = isFR && frBundle && frBundle.source === "live";
    if (live){
      return `<div class="row"><span class="nm">${esc(f)}</span>
        <span>${esc(t("frLiveBadge"))} · Federal Register API</span>
        <span class="sh">live</span></div>`;
    }
    return `<div class="row"><span class="nm">${esc(f)}</span>
      <span>${esc(MANIFEST.generated_at || "")}</span>
      <span class="sh">${m ? esc(String(m.sha256 || "").slice(0, 8)) || "—" : "—"}</span></div>`;
  });
  el.innerHTML = rows.join("");
}

/* ============================================================
   按类别浏览：章 → 4 位 heading → 6 位子目 → 8/10 位税则行
   索引只到 4 位 heading（38 KB gzip，懒加载）；更细的层级拿到整章分片后本地分组。
   ============================================================ */
let BROWSE = null;
const BS = { lv:0, ch:null, h4:null, h6:null, rows:null, kw:"" };

/* dg() 已在上面定义（去掉非数字字符），这里直接复用 */
function cleanName(s){ return String(s || "").replace(/[:：]\s*$/, "").trim(); }
function subName(row){
  const p = row.p || [];
  if (p.length > 1) return cleanName(p[1]) || cleanName(p[0]);
  return cleanName(p[0]) || cleanName(row.d);
}

async function openBrowse(){
  const p = document.getElementById("browse");
  p.classList.add("on");
  document.getElementById("browseBtn").setAttribute("aria-expanded", "true");
  document.getElementById("bfilt").value = "";
  BS.lv = 0; BS.ch = null; BS.h4 = null; BS.h6 = null; BS.rows = null; BS.kw = "";
  if (!BROWSE){
    document.getElementById("blist").innerHTML =
      `<div class="brow"><span class="bn">${esc(t("loading"))}</span></div>`;
    try { BROWSE = await gunzipFile("hts-" + TAG + "-browse.json.gz"); }
    catch (e){
      document.getElementById("blist").innerHTML =
        `<div class="brow"><span class="bn">${esc(String(e.message || e))}</span></div>`;
      return;
    }
  }
  renderBrowse();
}

function closeBrowse(){
  document.getElementById("browse").classList.remove("on");
  document.getElementById("browseBtn").setAttribute("aria-expanded", "false");
}

function browseCrumb(){
  const parts = [{ lab: t("browseLv0"), lv:0 }];
  if (BS.lv >= 1 && BS.ch) parts.push({ lab: "Ch. " + BS.ch, lv:1 });
  if (BS.lv >= 2 && BS.h4) parts.push({ lab: BS.h4, lv:2 });
  if (BS.lv >= 3 && BS.h6) parts.push({ lab: BS.h6, lv:3 });
  return parts.map((x, i) =>
    (i === parts.length - 1 ? `<b>${esc(x.lab)}</b>`
                            : `<span data-lv="${x.lv}">${esc(x.lab)}</span>`)
  ).join(" › ");
}

function renderBrowse(){
  const list = document.getElementById("blist");
  document.getElementById("bcrumb").innerHTML = browseCrumb();
  document.getElementById("bcrumb").querySelectorAll("span[data-lv]").forEach(s =>
    s.addEventListener("click", () => { BS.lv = parseInt(s.dataset.lv, 10); BS.kw = ""; document.getElementById("bfilt").value = ""; renderBrowse(); }));

  const kw = BS.kw.trim().toLowerCase();
  const item = (code, name, extra, cls, onclick) =>
    `<button class="brow ${cls}" data-go="${esc(code)}"><span class="bc">${esc(code)}</span>` +
    `<span class="bn">${esc(name)}</span>` +
    (extra ? `<span class="bg">${esc(extra)}</span>` : "") + `</button>`;

  let html = "", hits = [];
  if (BS.lv === 0){
    hits = BROWSE.chapters.map(c => ({
      code: c.ch,
      /* 中文模式下并列英文章名：筛选框里既能打中文也能打英文 */
      name: LANG === "zh-CN" ? ((c.zh || c.en) + (c.en ? " · " + c.en : "")) : c.en,
      extra: c.n + " " + t("rules"), cls: "lv0"
    }));
  } else if (BS.lv === 1){
    const c = BROWSE.chapters.find(x => x.ch === BS.ch);
    hits = (c ? c.heads : []).map(h => ({ code: h[0], name: h[1], extra: h[2] + " " + t("rules"), cls: "lv1" }));
  } else {
    const rows = (BS.rows || []).filter(r => dg(r.h).startsWith(BS.lv === 2 ? BS.h4 : BS.h6));
    if (BS.lv === 2){
      const seen = new Map();
      rows.forEach(r => {
        const d = dg(r.h), k = d.slice(0, 6);
        if (k.length === 6 && !seen.has(k)) seen.set(k, { code: k, name: subName(r), extra: "", cls: "lv2", rows: 1 });
        else if (seen.has(k)) seen.get(k).rows++;
      });
      hits = [...seen.values()].map(x => ({ ...x, extra: x.rows + " " + t("rules") }));
    } else {
      hits = rows.map(r => ({ code: r.h, name: displayName(r), extra: r.g || "", cls: "lv3" }));
    }
  }
  if (kw) hits = hits.filter(x => (x.code + " " + x.name).toLowerCase().includes(kw));
  if (!hits.length) html = `<div class="brow"><span class="bn">${esc(t("browseEmpty"))}</span></div>`;
  else hits.slice(0, 300).forEach(x => { html += item(x.code, x.name, x.extra, x.cls); });
  if (hits.length > 300)
    html += `<div class="brow"><span class="bn">${esc(t("moreN", { n:String(hits.length - 300) }))}</span></div>`;
  list.innerHTML = html;

  list.querySelectorAll(".brow[data-go]").forEach(b => b.addEventListener("click", () => {
    const code = b.dataset.go;
    if (BS.lv === 0){ BS.ch = code; BS.lv = 1; BS.kw = ""; document.getElementById("bfilt").value = ""; renderBrowse(); }
    else if (BS.lv === 1){
      BS.h4 = code; BS.lv = 2; BS.kw = "";
      document.getElementById("bfilt").value = "";
      list.innerHTML = `<div class="brow"><span class="bn">${esc(t("browseLoad", { c:BS.ch }))}</span></div>`;
      gunzipFile("hts-" + TAG + "-ch" + BS.ch + ".json.gz")
        .then(j => { BS.rows = j.rows; renderBrowse(); })
        .catch(e => { list.innerHTML = `<div class="brow"><span class="bn">${esc(String(e.message || e))}</span></div>`; });
    }
    else if (BS.lv === 2){ BS.h6 = code; BS.lv = 3; BS.kw = ""; document.getElementById("bfilt").value = ""; renderBrowse(); }
    else { document.getElementById("q").value = code; closeBrowse(); query(code); }
  }));
}

async function query(hs){
  const out = document.getElementById("out");
  out.innerHTML = `<div class="empty">${esc(t("loading"))}</div>`;
  try {
    const base = await lookupHS(hs);
    if (!base.found){ out.innerHTML = `<div class="err">${esc(t("errNotFound"))}</div>`; return; }
    const [ch99, frBundle] = await Promise.all([
      findCh99(base.digits),
      loadFR(base.digits, base.row)
    ]);
    const fr = frBundle.fr, adcvd = frBundle.adcvd;
    LAST = { hs, base, ch99, fr, adcvd, frBundle };
    render(LAST);
  } catch (e){
    out.innerHTML = `<div class="err">${esc(String(e.message || e))}</div>`;
  }
}

function markGuide(){
  const g = document.getElementById("guide");
  if (!g) return;
  const mk = g.querySelector(".mk");
  if (mk) mk.textContent = g.open ? "−" : "＋";
}

function applyStatic(){
  document.title = LANG === "zh-CN"
    ? "TariffLens · 关税与贸易合规参考"
    : "TariffLens · Tariff & Trade Compliance Reference";
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const k = el.dataset.i18n;
    el.textContent = (el.dataset.zh && LANG === "zh-CN") ? el.dataset.zh : t(k);
  });
  document.getElementById("themeBtn").textContent =
    document.documentElement.dataset.theme === "dark" ? t("themeBtnOn") : t("themeBtn");
  document.getElementById("langBtn").textContent = LANG === "zh-CN" ? "EN" : "中文";
  document.getElementById("langBtn").setAttribute("aria-pressed", String(LANG === "en"));
  document.getElementById("q").placeholder = t("srchPh");
  const s = document.getElementById("samples");
  s.innerHTML = SAMPLES.map(x =>
    `<button class="sample" data-hs="${x.hs}" title="${esc(LANG === "zh-CN" ? x.tip.zh : x.tip.en)}">` +
    `<span class="cat">${esc(LANG === "zh-CN" ? x.zh : x.en)}</span>` +
    `<span class="sep">·</span><code>${x.hs}</code></button>`
  ).join("");
  s.querySelectorAll(".sample").forEach(b =>
    b.addEventListener("click", () => { document.getElementById("q").value = b.dataset.hs; query(b.dataset.hs); }));

  const gsec = (title, arr) =>
    `<div class="gsec"><b>${esc(title)}</b><ul>${arr.map(x => "<li>" + esc(x) + "</li>").join("")}</ul></div>`;
  document.getElementById("gbody").innerHTML =
    gsec(t("guideTier"),  t("guideTierL"))  +
    gsec(t("guideForm"),  t("guideFormL"))  +
    gsec(t("guideEdge"),  t("guideEdgeL"))  +
    gsec(t("guideCol"),   t("guideColL"))   +
    gsec(t("guideTier"),  t("guideTierL"))  +
    gsec(t("guideForm"),  t("guideFormL"))  +
    gsec(t("guideAnnot"), t("guideAnnotL"));
  markGuide();
  document.getElementById("foot").innerHTML =
    [t("foot1"), t("foot2"), t("foot3")].map(esc).join("<br>");
  const bf = document.getElementById("bfilt");
  if (bf) bf.placeholder = t("browsePh");
  /* 面板开着时切语言要跟着重渲染（章名会中英切换） */
  if (BROWSE && document.getElementById("browse").classList.contains("on")) renderBrowse();
}

function setLang(l){
  LANG = l;
  applyStatic();
  if (LAST) render(LAST); else renderIdle();
}

/* 空态：首屏不预跑查询 —— 先交代「输入什么、会得到什么」，避免一进来就是一张密排结果报 */
function renderIdle(){
  document.getElementById("out").innerHTML =
    `<div class="idle">
      <div class="kicker">${esc(t("idleKicker"))}</div>
      <p class="lede">${t("idleLede")}</p>
      <p class="sub">${esc(t("idleSub"))}</p>
      <ul class="will">
        <li><b>${esc(t("idleWill1"))}</b>${esc(t("idleWill1d"))}</li>
        <li><b>${esc(t("idleWill2"))}</b>${esc(t("idleWill2d"))}</li>
        <li><b>${esc(t("idleWill3"))}</b>${esc(t("idleWill3d"))}</li>
      </ul>
    </div>`;
}

(async function init(){
  /* 硬约束：任何 applyLang / applyStatic 之前，先无条件快照一次中文原文 */
  document.querySelectorAll("[data-i18n]").forEach(el => { el.dataset.zh = el.textContent; });

  try { MANIFEST = await loadPlain("manifest.json"); } catch (e) { /* 溯源表降级为空 */ }
  const mh = document.getElementById("meta");
  const hts = MANIFEST && MANIFEST.hts;
  mh.innerHTML = [
    `<span>${esc(t("dataVer"))} <b>HTS ${esc(TAG)}</b></span>`,
    hts && hts.stats ? `<span>HTS <b>${hts.stats.leaf_rows.toLocaleString()}</b> 行</span>` : "",
    `<span>${esc(t("frLayer"))} · <b>${esc(t("frLiveOrSnap"))}</b></span>`,
    `<span>${esc(t("gen"))} <b>${esc((MANIFEST && MANIFEST.generated_at || "").slice(0, 10))}</b></span>`
  ].join("");

  applyStatic();

  document.getElementById("form").addEventListener("submit", e => {
    e.preventDefault();
    const v = document.getElementById("q").value.trim();
    if (v) query(v); else document.getElementById("q").focus();
  });

  const savedLang = localStorage.getItem("tl-lang");
  if (savedLang === "en") setLang("en");
  const savedTheme = localStorage.getItem("tl-theme");
  if (savedTheme === "dark"){
    document.documentElement.dataset.theme = "dark";
    document.getElementById("themeBtn").setAttribute("aria-pressed", "true");
    applyStatic();
  }
  document.getElementById("langBtn").addEventListener("click", () => {
    setLang(LANG === "zh-CN" ? "en" : "zh-CN");
    localStorage.setItem("tl-lang", LANG);
  });
  document.getElementById("themeBtn").addEventListener("click", () => {
    const dark = document.documentElement.dataset.theme !== "dark";
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    document.getElementById("themeBtn").setAttribute("aria-pressed", String(dark));
    localStorage.setItem("tl-theme", dark ? "dark" : "light");
    applyStatic();
  });

  /* 读法图例：默认折叠 —— 需要时点标题展开，展开状态跨会话记住 */
  const g = document.getElementById("guide");
  g.open = localStorage.getItem("tl-guide") === "open";
  g.addEventListener("toggle", () => {
    localStorage.setItem("tl-guide", g.open ? "open" : "closed");
    markGuide();
  });
  markGuide();

  /* 按类别浏览：不知道编码时的逐级下钻入口 */
  document.getElementById("browseBtn").addEventListener("click", () => {
    document.getElementById("browse").classList.contains("on") ? closeBrowse() : openBrowse();
  });
  document.getElementById("bclose").addEventListener("click", closeBrowse);
  document.getElementById("bfilt").addEventListener("input", e => {
    BS.kw = e.target.value; renderBrowse();
  });

  /* 首屏不自动查询：先给空态，让读者自己发起第一次查阅。
     例外：带 #hs=8507.60.00 这样的深链时才直接查 —— 便于分享某个具体编码的查阅结果。 */
  const deep = new URLSearchParams((location.hash || "").replace(/^#/, "")).get("hs");
  if (deep){
    document.getElementById("q").value = deep;
    query(deep);
  } else {
    renderIdle();
  }
})();
</script>
